name: CI

# Runs on every push and on every pull request
on:
  push:
  pull_request:
  workflow_dispatch:      # lets us start a run by hand from the GitHub website

jobs:
  test:
    name: Build and run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # keeps downloaded dependencies so later runs are much faster

      - name: Run test suite
        run: mvn -B test

      - name: Upload test reports
        if: always()            # upload even when tests fail, so we can read the reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/cucumber-report.html
          if-no-files-found: ignore
